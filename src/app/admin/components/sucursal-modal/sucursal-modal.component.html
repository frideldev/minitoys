@if (isOpen) {
    <div class="fixed inset-0 bg-black bg-opacity-50 flex items-center justify-center p-4 z-50">
        <!-- Modal Content -->
        <div class="bg-white rounded-lg shadow-xl w-full max-w-md" (click)="$event.stopPropagation()">
            <!-- Modal Header -->
            <div class="px-6 py-4 border-b border-gray-200">
                <h3 class="text-xl font-semibold text-gray-800">
                    {{ isEdit ? 'Editar Cliente' : 'Nuevo Cliente' }}
                </h3>
            </div>

            <!-- Modal Body -->
            <form [formGroup]="sucursalForm" (ngSubmit)="onSubmit()" class="p-6">
                <div class="space-y-4">
                    <!-- CI -->
                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-1">LUGAR</label>
                        <input type="text" formControlName="lugar"
                               class="w-full px-3 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-1 focus:ring-brand-orange focus:border-brand-orange">
                    </div>

                   
                </div>

                <!-- Form Actions -->
                <div class="mt-6 flex justify-end gap-3">
                    <button type="button" 
                            (click)="onClose()"
                            class="px-4 py-2 border border-gray-300 rounded-md text-gray-700 hover:bg-gray-50 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-brand-orange">
                        Cancelar
                    </button>
                    <button type="submit"
                            [disabled]="!sucursalForm.valid"
                            class="px-4 py-2 bg-gradient-to-r from-brand-yellow to-brand-orange text-white rounded-md hover:opacity-90 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-brand-orange disabled:opacity-50">
                        {{ isEdit ? 'Actualizar' : 'Guardar' }}
                    </button>
                </div>
            </form>
        </div>
    </div>
}
