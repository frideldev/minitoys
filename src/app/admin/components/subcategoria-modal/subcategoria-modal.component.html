@if (isOpen) {
    <div class="fixed inset-0 bg-gray-600 bg-opacity-50 overflow-y-auto h-full w-full flex items-center justify-center">
        <div class="relative bg-white rounded-lg shadow-xl max-w-md w-full">
            <div class="p-4">
                <div class="flex items-center justify-between mb-4">
                    <h3 class="text-xl font-semibold text-gray-900">
                        {{ isEdit ? 'Editar' : 'Nueva' }} Subcategoría
                    </h3>
                    <button type="button" 
                            class="text-gray-400 hover:text-gray-500"
                            (click)="onClose()">
                        <i class="fas fa-times"></i>
                    </button>
                </div>

                <!-- Categoria Select Component -->
                <app-categoria-select
                    (categoriaChange)="onCategoriaChange($event)">
                </app-categoria-select>

                <form [formGroup]="categoriaForm" (ngSubmit)="onSubmit()" class="mt-4">
                    <div class="mb-4">
                        <label class="block text-sm font-medium text-gray-700">Nombre</label>
                        <input type="text" 
                               formControlName="nombre"
                               class="mt-1 block w-full rounded-md border-gray-300 shadow-sm focus:border-brand-orange focus:ring-brand-orange">
                        @if (categoriaForm.get('nombre')?.hasError('required') && 
                             categoriaForm.get('nombre')?.touched) {
                            <p class="mt-1 text-sm text-red-600">El nombre es requerido</p>
                        }
                    </div>

                    <div class="flex items-center justify-end gap-2">
                        <button type="button"
                                class="px-4 py-2 text-sm font-medium text-gray-700 bg-white border border-gray-300 rounded-md hover:bg-gray-50"
                                (click)="onClose()">
                            Cancelar
                        </button>
                        <button type="submit"
                                [disabled]="!categoriaForm.valid || !currentCategoriaId"
                                class="px-4 py-2 text-sm font-medium text-white bg-brand-orange border border-transparent rounded-md hover:bg-brand-orange-dark disabled:opacity-50">
                            {{ isEdit ? 'Actualizar' : 'Crear' }}
                        </button>
                    </div>
                </form>
            </div>
        </div>
    </div>
}
