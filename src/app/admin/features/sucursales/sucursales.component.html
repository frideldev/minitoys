<app-layout>
    <div class="flex flex-1 overflow-hidden">
        <!-- Center Content Area -->
        <div class="flex-1 overflow-y-auto p-4 lg:p-6 bg-gray-50">
            <app-topbar tipo="mobile"></app-topbar>
            
            <!-- Search and Add Client - Mobile -->
            <div class="lg:hidden mb-6 flex flex-col sm:flex-row gap-3">
                <div class="relative flex-1">
                    <span class="absolute inset-y-0 left-0 flex items-center pl-3 text-gray-400">
                        <i class="fas fa-search"></i>
                    </span>
                    <input type="text" placeholder="Buscar cliente" 
                           class="w-full pl-10 pr-4 py-2 rounded-lg border border-gray-300 focus:outline-none focus:ring-2 focus:ring-brand-orange focus:border-transparent">
                </div>
                <button (click)="openNewSucursalModal()" 
                        class="bg-gradient-to-r from-brand-yellow to-brand-orange text-white py-2 px-4 rounded-lg font-medium flex items-center justify-center">
                    <i class="fas fa-plus mr-2"></i> Nueva Sucursal
                </button>
            </div>

            <!-- Clients Table Section -->
            <div class="bg-white rounded-xl shadow-sm overflow-hidden mb-6">
                <div class="p-4 border-b border-gray-100 flex justify-between items-center">
                    <h2 class="text-xl font-bold text-gray-800">Lista de Sucursales</h2>
                    <div class="hidden lg:block">
                        <button (click)="openNewSucursalModal()" 
                                class="bg-gradient-to-r from-brand-yellow to-brand-orange text-white py-2 px-4 rounded-lg font-medium flex items-center">
                            <i class="fas fa-plus mr-2"></i> Nueva Sucursal
                        </button>
                    </div>
                </div>

                <!-- Loading State -->
                @if (state().status === 'loading') {
                    <div class="p-8 text-center">
                        <div class="inline-block animate-spin rounded-full h-8 w-8 border-4 border-solid border-brand-orange border-r-transparent"></div>
                        <p class="mt-2 text-gray-500">Cargando sucursales...</p>
                    </div>
                }

                <!-- Error State -->
                @if (state().status === 'error') {
                    <div class="p-4 bg-red-50 text-red-600">
                        {{ state().error }}
                    </div>
                }

                <!-- Table -->
                @if (state().status === 'success') {
                    <div class="overflow-x-auto">
                        <table class="min-w-full divide-y divide-gray-200">
                            <thead>
                                <tr class="bg-brand-yellow text-white">
                                    <th class="px-6 py-3 text-left text-sm font-medium">LUGAR</th>
                                    
                                    <th class="px-6 py-3 text-right text-sm font-medium">Acciones</th>
                                </tr>
                            </thead>
                            <tbody class="bg-white divide-y divide-gray-200">
                                @for (item of state().sucursales; track item.id) {
                                    <tr class="hover:bg-gray-50">
                                        <td class="px-6 py-4 whitespace-nowrap text-sm text-gray-900">{{ item.lugar }}</td>
                                        <td class="px-6 py-4 whitespace-nowrap text-sm font-medium text-right">
                                            <div class="flex justify-end space-x-2">
                                                <button (click)="openEditSucursalModal(item)" 
                                                        class="bg-brand-yellow text-white px-3 py-1 rounded-md flex items-center">
                                                    <i class="fas fa-edit mr-1"></i> 
                                                </button>
                                                <button (click)="confirmDelete(item)" 
                                                        class="bg-brand-orange text-white px-3 py-1 rounded-md flex items-center">
                                                    <i class="fas fa-trash-alt mr-1"></i> 
                                                </button>
                                            </div>
                                        </td>
                                    </tr>
                                }
                            </tbody>
                        </table>
                    </div>
                }

                <!-- Add Pagination -->
               <!--  <div class="px-6 py-4 flex items-center justify-center">
                    <nav class="flex items-center space-x-1">
                        <a href="#" class="px-3 py-1 rounded-md bg-brand-yellow text-white font-medium">1</a>
                        <a href="#" class="px-3 py-1 rounded-md text-gray-500 hover:bg-gray-100">2</a>
                        <a href="#" class="px-3 py-1 rounded-md text-gray-500 hover:bg-gray-100">3</a>
                        <a href="#" class="px-3 py-1 rounded-md text-gray-500 hover:bg-gray-100">4</a>
                        <a href="#" class="px-3 py-1 rounded-md text-gray-500 hover:bg-gray-100">5</a>
                        <a href="#" class="px-3 py-1 rounded-md text-gray-500 hover:bg-gray-100">
                            <i class="fas fa-chevron-right"></i>
                        </a>
                    </nav>
                </div> -->
            </div>
        </div>

        <!-- Right Sidebar -->
        <div class="hidden lg:block w-80 bg-white border-l border-gray-200 overflow-y-auto">
            <app-estadisticas></app-estadisticas>
        </div>
    </div>
</app-layout>

<!-- Cliente Modal -->
<app-sucursal-modal 
    [isOpen]="showModal"
    [isEdit]="isEdit"
    [sucursal]="selectedSucursal"
    (closeModal)="showModal = false"
    (saveSucursal)="onSaveSucursal($event)">
</app-sucursal-modal>
