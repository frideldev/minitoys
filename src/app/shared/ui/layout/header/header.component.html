 <!-- Mobile Header -->
 <header class="lg:hidden bg-white border-b border-gray-200 sticky top-0 z-50">
    <div class="flex justify-between items-center px-4 py-3">
        <div class="flex items-center">
            <div class="mr-2 shrink-0">
                <img [src]="'./assets/image/logo.png'" alt="Minitoys" class="h-8 w-8 object-contain">
            </div>
            <span class="font-bold text-lg">MINITOYS</span>
        </div>
        <button (click)="toggleMenu()" class="menu-toggle text-gray-500 hover:text-gray-700 p-2">
            <i class="fas fa-bars text-xl"></i>
        </button>
    </div>
</header>

<!-- Mobile Menu -->
<div id="mobileMenu" class="mobile-menu fixed inset-y-0 left-0 w-64 bg-sidebar-dark text-white z-50 lg:hidden">
    <div class="p-4 border-b border-gray-700">
        <button (click)="closeMenu()" class="text-gray-400 hover:text-white absolute right-4 top-4 p-2">
            <i class="fas fa-times text-lg"></i>
        </button>
        <div class="flex items-center">
            <div class="mr-2 shrink-0">
                <img [src]="'./assets/image/logo.png'" alt="Minitoys" class="h-10 w-10 object-contain">
            </div>
            <span class="font-bold text-lg">MINITOYS</span>
        </div>
    </div>
    <!-- Mobile Navigation -->
    <nav class="p-4">
        <div class="mb-4">
            <div class="text-xs font-semibold text-gray-400 uppercase tracking-wider mb-2">GENERAL</div>
            <a routerLink="/users/ventas"
               routerLinkActive="bg-gradient-to-r from-brand-yellow to-brand-orange text-white"
               [routerLinkActiveOptions]="{exact: true}"
               (click)="onMenuItemClick()"
               class="block py-2 px-4 text-gray-300 hover:bg-gray-700 rounded-lg mb-1 transition-colors">
                <i class="fas fa-shopping-cart mr-3"></i> Ventas
            </a>
            <a routerLink="/users/reportes"
               routerLinkActive="bg-gradient-to-r from-brand-yellow to-brand-orange text-white"
               [routerLinkActiveOptions]="{exact: true}"
               (click)="onMenuItemClick()"
               class="block py-2 px-4 text-gray-300 hover:bg-gray-700 rounded-lg mb-1 transition-colors">
                <i class="fas fa-file-alt mr-3"></i> Reportes
            </a>
            <a routerLink="/users/dashboard" 
               routerLinkActive="bg-gradient-to-r from-brand-yellow to-brand-orange text-white"
               [routerLinkActiveOptions]="{exact: true}"
               (click)="onMenuItemClick()"
               class="block py-2 px-4 text-gray-300 hover:bg-gray-700 rounded-lg mb-1 transition-colors">
                <i class="fas fa-chart-pie mr-3"></i> Dashboard
            </a>
            <a routerLink="/users/inventario" 
               routerLinkActive="bg-gradient-to-r from-brand-yellow to-brand-orange text-white"
               [routerLinkActiveOptions]="{exact: true}"
               (click)="onMenuItemClick()"
               class="block py-2 px-4 text-gray-300 hover:bg-gray-700 rounded-lg mb-1 transition-colors">
                <i class="fas fa-boxes mr-3"></i> Inventario
            </a>
            <a routerLink="/users/clientes"
               routerLinkActive="bg-gradient-to-r from-brand-yellow to-brand-orange text-white"
               [routerLinkActiveOptions]="{exact: true}"
               (click)="onMenuItemClick()"
               class="block py-2 px-4 text-gray-300 hover:bg-gray-700 rounded-lg mb-1 transition-colors">
                <i class="fas fa-users mr-3"></i> Clientes
            </a>
            <a routerLink="/users/formaspago"
               routerLinkActive="bg-gradient-to-r from-brand-yellow to-brand-orange text-white"
               [routerLinkActiveOptions]="{exact: true}"
               (click)="onMenuItemClick()"
               class="block py-2 px-4 text-gray-300 hover:bg-gray-700 rounded-lg mb-1 transition-colors">
                <i class="fas fa-credit-card mr-3"></i> Formas de Pago
            </a>
        </div>
        
        <div class="mb-4">
            <div class="text-xs font-semibold text-gray-400 uppercase tracking-wider mb-2">ADMIN</div>
            <a routerLink="/admin/usuarios" 
               routerLinkActive="bg-gradient-to-r from-brand-yellow to-brand-orange text-white"
               [routerLinkActiveOptions]="{exact: true}"
               (click)="onMenuItemClick()"
               class="block py-2 px-4 text-gray-300 hover:bg-gray-700 rounded-lg mb-1 transition-colors">
                <i class="fas fa-user-shield mr-3"></i> Usuarios
            </a>
            <a routerLink="/admin/sucursales" 
               routerLinkActive="bg-gradient-to-r from-brand-yellow to-brand-orange text-white"
               [routerLinkActiveOptions]="{exact: true}"
               (click)="onMenuItemClick()"
               class="block py-2 px-4 text-gray-300 hover:bg-gray-700 rounded-lg mb-1 transition-colors">
                <i class="fas fa-building mr-3"></i> Sucursales
            </a>
            <a routerLink="/admin/categorias" 
               routerLinkActive="bg-gradient-to-r from-brand-yellow to-brand-orange text-white"
               [routerLinkActiveOptions]="{exact: true}"
               (click)="onMenuItemClick()"
               class="block py-2 px-4 text-gray-300 hover:bg-gray-700 rounded-lg mb-1 transition-colors">
                <i class="fas fa-tags mr-3"></i> Categorías
            </a>
            <a routerLink="/admin/subcategorias" 
               routerLinkActive="bg-gradient-to-r from-brand-yellow to-brand-orange text-white"
               [routerLinkActiveOptions]="{exact: true}"
               (click)="onMenuItemClick()"
               class="block py-2 px-4 text-gray-300 hover:bg-gray-700 rounded-lg mb-1 transition-colors">
                <i class="fas fa-tag mr-3"></i> Sub Categorías
            </a>
            <a routerLink="/admin/lugares" 
               routerLinkActive="bg-gradient-to-r from-brand-yellow to-brand-orange text-white"
               [routerLinkActiveOptions]="{exact: true}"
               (click)="onMenuItemClick()"
               class="block py-2 px-4 text-gray-300 hover:bg-gray-700 rounded-lg mb-1 transition-colors">
                <i class="fas fa-map-marker-alt mr-3"></i> Lugares
            </a>
        </div>
    </nav>
</div>
