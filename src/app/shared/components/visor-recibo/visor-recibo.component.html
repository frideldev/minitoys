<!-- Modal Visor de Recibo -->
@if (isVisible()) {
    <div class="fixed inset-0 bg-black bg-opacity-50 flex items-center justify-center z-50" (click)="cerrarModal()">
        <div class="bg-white rounded-xl shadow-xl max-w-4xl w-full mx-4 max-h-[90vh] flex flex-col" (click)="$event.stopPropagation()">
            <!-- Header del Modal -->
            <div class="p-6 border-b border-gray-200 flex justify-between items-center">
                <h2 class="text-xl font-bold text-gray-900">Recibo de Venta</h2>
                <button 
                    (click)="cerrarModal()"
                    class="text-gray-500 hover:text-gray-700 transition-colors">
                    <i class="fas fa-times text-xl"></i>
                </button>
            </div>

            <!-- Contenido del Modal -->
            <div class="flex-1 overflow-hidden">
                @if (reciboLoading()) {
                    <!-- Loading state -->
                    <div class="p-8 text-center">
                        <div class="animate-spin rounded-full h-8 w-8 border-b-2 border-orange-500 mx-auto mb-4"></div>
                        <p class="text-gray-500">Cargando recibo...</p>
                    </div>
                } @else if (reciboHtml()) {
                    <!-- Visor HTML -->
                    <div class="h-full overflow-auto p-6">
                        <div class="bg-white border rounded-lg">
                            <div class="recibo-content" [innerHTML]="reciboHtml()"></div>
                        </div>
                    </div>
                } @else {
                    <!-- Error state -->
                    <div class="p-8 text-center">
                        <i class="fas fa-exclamation-triangle text-4xl text-red-300 mb-4"></i>
                        <h3 class="text-lg font-medium text-gray-600 mb-2">Error al cargar el recibo</h3>
                        <p class="text-gray-500">No se pudo cargar el contenido del recibo.</p>
                    </div>
                }
            </div>

            <!-- Footer del Modal -->
            <div class="p-6 border-t border-gray-200 flex justify-between items-center">
                <div>
                </div>
                <div class="flex space-x-3">
                    <button 
                        (click)="cerrarModal()"
                        class="px-4 py-2 text-gray-700 bg-gray-100 hover:bg-gray-200 rounded-lg transition-colors">
                        Cerrar
                    </button>
                    @if (reciboHtml()) {
                        <button 
                            (click)="imprimir()"
                            [disabled]="generandoPdf"
                            class="px-4 py-2 bg-orange-500 text-white hover:bg-orange-600 rounded-lg transition-colors flex items-center disabled:opacity-50 disabled:cursor-not-allowed">
                            @if (generandoPdf) {
                                <div class="animate-spin rounded-full h-4 w-4 border-b-2 border-white mr-2"></div>
                                Generando PDF...
                            } @else {
                                <i class="fas fa-file-pdf mr-2"></i>
                                Generar PDF
                            }
                        </button>
                    }
                </div>
            </div>
        </div>
    </div>
}
