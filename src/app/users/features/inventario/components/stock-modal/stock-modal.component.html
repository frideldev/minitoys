@if (isOpen) {
  <div class="fixed inset-0 bg-black bg-opacity-50 flex items-center justify-center z-50 p-4">
    <div class="bg-white rounded-xl w-full max-w-lg shadow-2xl" (click)="$event.stopPropagation()">
      <div class="flex justify-between items-center px-6 py-4 border-b border-gray-100">
        <div>
          <h2 class="text-base font-semibold text-gray-800">Actualizar stock del producto</h2>
          <p class="text-xs text-gray-500">{{ item?.descripcion }}</p>
        </div>
        <button (click)="onClose()" class="w-8 h-8 rounded-lg hover:bg-gray-100 text-gray-500">
          <i class="fas fa-times"></i>
        </button>
      </div>

      <form [formGroup]="stockForm" (ngSubmit)="onSubmit()" class="p-6 space-y-4">
        <div class="grid grid-cols-2 gap-3 p-3 bg-gray-50 rounded-lg text-sm">
          <div>
            <p class="text-xs text-gray-500 mb-0.5">Stock actual</p>
            <p class="font-semibold text-gray-800">{{ item?.stock_global_actual ?? 0 }}</p>
          </div>
          <div>
            <p class="text-xs text-gray-500 mb-0.5">Precio de compra</p>
            <p class="font-semibold text-gray-800">{{ item?.precioCompra | number:'1.2-2' }} Bs</p>
          </div>
        </div>

        <div>
          <label class="block text-sm font-medium text-gray-700 mb-1">Nuevo stock</label>
          <input type="number" formControlName="stock" min="0"
                 class="w-full rounded-lg border border-gray-300 px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-blue-500">
        </div>
        <div>
          <label class="block text-sm font-medium text-gray-700 mb-1">Precio de compra (Bs)</label>
          <input type="number" formControlName="precio" step="0.01" min="0"
                 class="w-full rounded-lg border border-gray-300 px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-blue-500">
        </div>

        <div class="flex justify-end gap-3 pt-2">
          <button type="button" (click)="onClose()"
                  class="px-4 py-2 text-sm font-medium text-gray-700 bg-gray-100 hover:bg-gray-200 rounded-lg">
            Cancelar
          </button>
          <button type="submit" [disabled]="!stockForm.valid"
                  class="px-4 py-2 text-sm font-medium text-white bg-blue-600 hover:bg-blue-700 rounded-lg disabled:opacity-50">
            Guardar stock
          </button>
        </div>
      </form>
    </div>
  </div>
}
