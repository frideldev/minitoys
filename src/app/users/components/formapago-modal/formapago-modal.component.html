<!-- Modal Backdrop -->
<div *ngIf="isOpen" class="fixed inset-0 bg-black bg-opacity-50 flex items-center justify-center z-50">
  <!-- Modal Container -->
  <div class="bg-white rounded-lg shadow-xl w-full max-w-md mx-4 transform transition-all">
    <!-- Modal Header -->
    <div class="flex items-center justify-between p-6 border-b border-gray-200">
      <h3 class="text-lg font-semibold text-gray-900">
        {{ isEdit ? 'Editar Forma de Pago' : 'Nueva Forma de Pago' }}
      </h3>
      <button (click)="onClose()" class="text-gray-400 hover:text-gray-600 transition-colors">
        <i class="fas fa-times"></i>
      </button>
    </div>

    <!-- Modal Body -->
    <form [formGroup]="formaPagoForm" (ngSubmit)="onSubmit()" class="p-6">
      <!-- Nombre Field -->
      <div class="mb-4">
        <label for="nombre" class="block text-sm font-medium text-gray-700 mb-2">
          Nombre <span class="text-red-500">*</span>
        </label>
        <input
          type="text"
          id="nombre"
          formControlName="nombre"
          class="w-full px-3 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-brand-orange focus:border-transparent"
          [class.border-red-500]="nombre?.invalid && nombre?.touched"
          placeholder="Ej: Efectivo, Tarjeta de Crédito, etc."
        />
        <div *ngIf="nombre?.invalid && nombre?.touched" class="mt-1 text-sm text-red-600">
          <div *ngIf="nombre?.errors?.['required']">El nombre es obligatorio</div>
          <div *ngIf="nombre?.errors?.['minlength']">El nombre debe tener al menos 2 caracteres</div>
        </div>
      </div>

      <!-- Descripción Field -->
      <div class="mb-4">
        <label for="descripcion" class="block text-sm font-medium text-gray-700 mb-2">
          Descripción
        </label>
        <textarea
          id="descripcion"
          formControlName="descripcion"
          rows="3"
          class="w-full px-3 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-brand-orange focus:border-transparent"
          placeholder="Descripción opcional de la forma de pago"
        ></textarea>
      </div>

      <!-- Activo Field -->
      <div class="mb-6">
        <label class="flex items-center">
          <input
            type="checkbox"
            formControlName="activo"
            class="w-4 h-4 text-brand-orange bg-gray-100 border-gray-300 rounded focus:ring-brand-orange focus:ring-2"
          />
          <span class="ml-2 text-sm font-medium text-gray-700">Activo</span>
        </label>
      </div>

      <!-- Modal Footer -->
      <div class="flex justify-end space-x-3 pt-4 border-t border-gray-200">
        <button
          type="button"
          (click)="onClose()"
          class="px-4 py-2 text-sm font-medium text-gray-700 bg-gray-100 hover:bg-gray-200 rounded-md transition-colors"
        >
          Cancelar
        </button>
        <button
          type="submit"
          [disabled]="formaPagoForm.invalid"
          class="px-4 py-2 text-sm font-medium text-white bg-gradient-to-r from-brand-yellow to-brand-orange hover:from-brand-orange hover:to-brand-yellow rounded-md transition-all disabled:opacity-50 disabled:cursor-not-allowed"
        >
          {{ isEdit ? 'Actualizar' : 'Crear' }}
        </button>
      </div>
    </form>
  </div>
</div>
